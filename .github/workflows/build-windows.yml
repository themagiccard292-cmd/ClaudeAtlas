name: Build Windows installer

# Builds in the cloud so nobody needs Node.js or Python installed.
# Run it from the Actions tab ("Run workflow") or push a tag like v1.1.0.
# By default it also publishes a GitHub Release with the .exe files attached (Releases page = download button).
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the installers'
        type: boolean
        default: true
      tag:
        description: 'Release tag (e.g. v1.2.0) - becomes the app version, so it must be higher than the last release'
        type: string
        default: 'v1.2.0'
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set app version from the release tag (the updater compares versions)
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          npm pkg set version=$($tag.TrimStart('v'))
      - name: Build (backend.exe + UI + installers)
        shell: cmd
        env:
          PY_CMD: python   # the 3.12 installed above, not the newest on the runner
        run: call build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-OS-Agent-Windows
          path: |
            release/Claude-OS-Agent-Setup.exe
            release/Claude-OS-Agent-Portable.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Claude OS Agent ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/Claude-OS-Agent-Setup.exe
            release/Claude-OS-Agent-Setup.exe.blockmap
            release/Claude-OS-Agent-Portable.exe
            release/latest.yml
